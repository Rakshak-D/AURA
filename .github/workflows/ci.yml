name: AURA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install core and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run deterministic test suite
        env:
          AURA_ENVIRONMENT: test
        run: python -m pytest -m "not browser" --cov=backend.app --cov-report=term-missing --cov-report=xml
      - name: Compile Python sources
        run: python -m compileall -q backend tests
      - name: Ruff checks
        # The repository has pre-existing lint debt outside this phase. Keep
        # the required CI check focused on newly maintained test infrastructure.
        run: python -m ruff check tests/conftest.py tests/browser tests/test_authentication.py tests/test_web_security.py tests/test_phase9_isolation.py backend/app/database.py
      - name: Dependency consistency
        run: python -m pip check
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    name: Frontend syntax and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print)
      - name: Run frontend API contract checks
        run: node tests/frontend_contracts.test.mjs
      - name: Reject dangerous browser sinks
        shell: bash
        run: |
          ! grep -RInE '(^|[^[:alnum:]_])(eval|Function)[[:space:]]*\(|document\.write|simulateStreaming' frontend/js
      - name: Ensure browser token URLs are not used
        shell: bash
        run: '! grep -RInE "ws/notifications\?token=|access_token=.*(ws|WebSocket)" frontend/js'

  browser:
    name: Playwright browser regressions
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test and browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        env:
          AURA_RUN_BROWSER: "1"
        run: python -m pytest -m browser -q
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: tests/browser-artifacts
          if-no-files-found: ignore

  deployment:
    name: Production container smoke test
    runs-on: ubuntu-latest
    needs: [python, frontend, browser]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
          AURA_DOMAIN: localhost
        run: |
          docker compose config --quiet
          docker compose --profile tls config --quiet
          test -f Caddyfile
          grep -F 'reverse_proxy aura:8000' Caddyfile
      - name: Build the CPU-only production image
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: docker compose build aura
      - name: Inspect production image boundaries
        run: |
          test "$(docker inspect -f '{{.Config.User}}' aura:runtime)" = "aura"
          docker inspect aura:runtime --format '{{json .Config.Cmd}}' | grep -F -- '--workers'
          docker inspect aura:runtime --format '{{json .Config.Cmd}}' | grep -F -- '"1"'
          docker run --rm aura:runtime python -c "import importlib.util, os; assert os.getuid() != 0; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('llama_cpp') is None; assert not os.path.exists('/opt/aura/tests')"
      - name: Start the localhost deployment
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: docker compose up -d aura
      - name: Wait for readiness
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /tmp/aura-ready.json; then
              cat /tmp/aura-ready.json
              break
            fi
            sleep 2
          done
          test -s /tmp/aura-ready.json
      - name: Run deployment smoke test
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: python scripts/deployment_smoke.py --token-file "$RUNNER_TEMP/aura-token"
      - name: Restart and verify persistence
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: |
          docker compose restart aura
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then break; fi
            sleep 2
          done
          python scripts/deployment_smoke.py --token-file "$RUNNER_TEMP/aura-token"
      - name: Create backup with the production implementation
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: |
          docker compose exec -T aura sh -c 'printf backup-marker > /var/lib/aura/data/uploads/deployment-backup-marker.txt'
          docker compose exec -T aura python scripts/backup.py backup /tmp/aura-backup.tar.gz
          docker compose cp aura:/tmp/aura-backup.tar.gz "$RUNNER_TEMP/aura-backup.tar.gz"
          test -s "$RUNNER_TEMP/aura-backup.tar.gz"
      - name: Destroy deployment state and restore into a fresh volume
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: |
          docker compose down -v
          docker compose run --rm --no-deps --entrypoint python \
            -v "$RUNNER_TEMP:/tmp/restore:ro" aura \
            scripts/backup.py restore /tmp/restore/aura-backup.tar.gz
          docker compose up -d aura
      - name: Verify restored backup after startup
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then break; fi
            sleep 2
          done
          docker compose exec -T aura test -f /var/lib/aura/data/uploads/deployment-backup-marker.txt
          python scripts/deployment_smoke.py --token-file "$RUNNER_TEMP/aura-token"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs aura
      - name: Stop deployment
        if: always()
        env:
          AUTH_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456
        run: docker compose down -v
