name: AURA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install core and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run deterministic test suite
        env:
          AURA_ENVIRONMENT: test
        run: python -m pytest -m "not browser" --cov=backend.app --cov-report=term-missing --cov-report=xml
      - name: Compile Python sources
        run: python -m compileall -q backend tests
      - name: Ruff checks
        # The repository has pre-existing lint debt outside this phase. Keep
        # the required CI check focused on newly maintained test infrastructure.
        run: python -m ruff check tests/conftest.py tests/browser tests/test_authentication.py tests/test_web_security.py
      - name: Dependency consistency
        run: python -m pip check
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    name: Frontend syntax and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print)
      - name: Reject dangerous browser sinks
        shell: bash
        run: |
          ! grep -RInE '(^|[^[:alnum:]_])(eval|Function)[[:space:]]*\(|document\.write|simulateStreaming' frontend/js
      - name: Ensure browser token URLs are not used
        shell: bash
        run: '! grep -RInE "ws/notifications\?token=|access_token=.*(ws|WebSocket)" frontend/js'

  browser:
    name: Playwright browser regressions
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test and browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        env:
          AURA_RUN_BROWSER: "1"
        run: python -m pytest -m browser -q
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: tests/browser-artifacts
          if-no-files-found: ignore
