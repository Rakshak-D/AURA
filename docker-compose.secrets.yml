# Optional production override. Create the external secret before use:
#   printf '%s' "$(openssl rand -hex 32)" | docker secret create aura_auth_secret -
# This file is intentionally not part of the default Compose path.
services:
  aura:
    environment:
      AUTH_SECRET_KEY: ""
      AUTH_SECRET_KEY_FILE: /run/secrets/aura_auth_secret
    secrets:
      - aura_auth_secret

secrets:
  aura_auth_secret:
    external: true
